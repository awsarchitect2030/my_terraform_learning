
name: Terraform CI

on:
  push:
    paths:
      - "day19/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform action"
        type: choice
        options:
             - plan
             - apply
             - destroy
        default: plan
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: day19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::931628309022:role/GitHubActionsTerraformRole
          aws-region: ap-south-1
      
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init
        working-directory: day19
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint
        working-directory: day19

      - name: Trivy Terraform Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: day19
          severity: HIGH,CRITICAL
          exit-code: "0"
       
      - name: Trivy Django Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/itsbaivab/django-app:latest
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: day19
          framework: terraform

      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: day19
          framework: terraform

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve
